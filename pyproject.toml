[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zotero-audio"
version = "0.2.0"
description = "Local, provenance-preserving Zotero PDF to AAC/M4A pipeline for macOS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mutagen>=1.47,<2",
  "Pillow>=11,<13",
  "pypdf>=6.0,<7",
  "pymupdf4llm==1.28.2",
  "mcp>=1.26,<2",
]

[project.optional-dependencies]
kokoro-onnx = [
  "kokoro-onnx==0.6.1",
]
mlx = [
  # Apple silicon only; the markers make `pip install '.[mlx]'` a no-op elsewhere.
  "mlx-audio==0.4.1; platform_machine == 'arm64'",
  "misaki[en]==0.9.4; platform_machine == 'arm64'",
]
# CPU PyTorch Kokoro for Intel Macs and x86_64 Linux (no MLX). Intel macOS has
# no wheels newer than torch 2.2.2 (Python <= 3.12), which needs NumPy 1.x and
# a transformers release that still supports it.
kokoro-torch = [
  "kokoro==0.9.4; platform_machine != 'arm64'",
  "misaki[en]==0.9.4; platform_machine != 'arm64'",
  "torch==2.2.2; platform_machine == 'x86_64' and sys_platform == 'darwin'",
  "numpy<2; platform_machine == 'x86_64' and sys_platform == 'darwin'",
  "transformers<5; platform_machine == 'x86_64' and sys_platform == 'darwin'",
]
dev = [
  "pytest>=8.4,<9",
]

[project.scripts]
zotero-audio = "zotero_audio.cli:main"
za = "zotero_audio.app_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zotero_audio = ["assets/*.mp3", "assets/*.png"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
