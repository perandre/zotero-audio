# Copy outside the repository, fill in real paths/identity, then pass it to
# `zotero-audio podcast build --config ...` or `scripts/auto_sync.py`.

[paths]
private_root = "/Users/you/Library/Mobile Documents/com~apple~CloudDocs/Podcasts/1 More Paper"
state_root = "/Users/you/Sites/zotero-audio-runtime/podcast"
# This is a local mirror that a separate object-storage adapter can upload.
public_root = "/Users/you/Sites/zotero-audio-runtime/podcast/public"

[podcast]
# Optional canonical site origin (e.g. "https://www.1morepaper.com") for feed
# URLs, show artwork and episode page links. Leave empty to use base_url.
# Audio and other media URLs always use base_url.
feed_base_url = ""
base_url = "https://1morepaper.com"
# Set only while moving existing subscribers from an older feed domain.
# Keep the old feed online with a 301 redirect for at least four weeks.
# previous_feed_base_url = "https://perandre.no/1mp"
site_title = "1 More Paper"
site_description = "1 More Paper turns openly licensed research papers into carefully produced audio editions: a Brief with the authors' abstract and, when suitable, conclusion, and a Full Reading of the paper's approved prose."
language = "en"
author = "Per André Rønsen"
owner_name = "Per André Rønsen"
# This address is public in RSS and is used for Spotify ownership verification.
owner_email = "podcast@example.org"
category = "Science"
copyright = "1 More Paper"

# Safety defaults: preview only, with no public-tree or feed mutation.
dry_run = true
publishing_enabled = false
# Optional Cloudflare R2 bucket for the automatic public-mirror sync.
r2_bucket = ""

[shows.brief]
title = "1 More Paper (Brief)"
description = "Discover how organizations adopt AI, reshape work, and govern its use. Research abstracts and key conclusions, in the authors' own words, read verbatim (by AI)."
guid = "f25aa92b-5bea-51f8-b842-0836db8713ed"

[shows.full]
title = "1 More Paper"
description = "Listen to the latest research on how organizations adopt AI, reshape work, and govern its use. Full papers, read verbatim (by AI)."
guid = "119266cf-33b9-5795-bcc2-0e81e72291ef"
